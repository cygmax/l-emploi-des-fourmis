name: Deploy to GitHub Pages

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2

      - run: bun install --frozen-lockfile

      # GitHub Pages serves the site under /<repo-name>/, so the build needs
      # that prefix as Vite base AND as router basename (via BASE_URL).
      # VITE_PWA enables the manifest + service worker (GitHub runner paths
      # have no apostrophe, unlike the local project folder).
      - run: bunx tsc -b
      - run: bunx vite build --base="/${{ github.event.repository.name }}/"
        env:
          VITE_PWA: 'true'

      # SPA fallback: deep links (/candidature/3) are served by GitHub Pages
      # as a 404; a copy of index.html under 404.html boots the app instead.
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
