<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22c55e"/>
      <stop offset="100%" stop-color="#166534"/>
    </linearGradient>
  </defs>
  <!-- Background circle -->
  <circle cx="256" cy="256" r="240" fill="url(#bg)" opacity="0.1"/>
  <circle cx="256" cy="256" r="200" fill="url(#bg)" opacity="0.08"/>

  <!-- Fourmi corps -->
  <!-- Abdomen -->
  <ellipse cx="310" cy="310" rx="55" ry="45" fill="#1c1917" transform="rotate(-30, 310, 310)"/>
  <!-- Thorax -->
  <ellipse cx="240" cy="260" rx="35" ry="28" fill="#292524" transform="rotate(-15, 240, 260)"/>
  <!-- Tête -->
  <circle cx="190" cy="220" r="30" fill="#1c1917"/>

  <!-- Yeux -->
  <circle cx="180" cy="210" r="5" fill="#34d399"/>
  <circle cx="165" cy="208" r="4" fill="#34d399"/>

  <!-- Antennes -->
  <path d="M175 195 Q160 170 150 155" stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M185 192 Q185 165 195 148" stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round"/>
  <circle cx="150" cy="155" r="4" fill="#34d399"/>
  <circle cx="195" cy="148" r="4" fill="#34d399"/>

  <!-- Pattes -->
  <path d="M240 250 Q220 280 200 300" stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M255 245 Q250 285 245 320" stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round"/>
  <path d="M270 255 Q280 290 285 330" stroke="#292524" stroke-width="3" fill="none" stroke-linecap="round"/>

  <!-- Cravate (orange) -->
  <path d="M195 240 L210 245 L205 285 L195 300 L185 285 L180 245 Z" fill="#22c55e"/>
  <path d="M195 240 L210 245 L205 275 L195 285 L185 275 L180 245 Z" fill="#166534"/>

  <!-- Feuille de poste dans la main (patte avant) -->
  <rect x="155" y="255" width="35" height="45" rx="3" fill="white" stroke="#d6d3d1" stroke-width="1.5"
        transform="rotate(10, 172, 277)"/>
  <!-- Lignes sur la feuille -->
  <line x1="162" y1="268" x2="183" y2="268" stroke="#d6d3d1" stroke-width="1.5" transform="rotate(10, 172, 277)"/>
  <line x1="162" y1="275" x2="183" y2="275" stroke="#d6d3d1" stroke-width="1.5" transform="rotate(10, 172, 277)"/>
  <line x1="162" y1="282" x2="178" y2="282" stroke="#d6d3d1" stroke-width="1.5" transform="rotate(10, 172, 277)"/>
  <!-- Checkmark sur la feuille -->
  <path d="M165 292 L172 298 L185 284" stroke="#22c55e" stroke-width="2" fill="none" stroke-linecap="round" stroke-linejoin="round"
        transform="rotate(10, 172, 277)"/>

  <!-- Texte -->
  <text x="256" y="420" text-anchor="middle" font-family="system-ui, sans-serif" font-size="28" font-weight="800" fill="#1c1917">L'EMPLOI DES</text>
  <text x="256" y="458" text-anchor="middle" font-family="system-ui, sans-serif" font-size="36" font-weight="900" fill="#166534">FOURMIS</text>
</svg>